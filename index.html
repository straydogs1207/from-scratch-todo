<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From-Scratch Todo (Custom Reconciler)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    .todo-app {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 440px;
    }
    h1 {
      margin-top: 0;
      font-size: 1.4rem;
      color: #1a202c;
      text-align: center;
    }
    .subtitle {
      font-size: 0.82rem;
      color: #718096;
      text-align: center;
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #3182ce;
    }
    button.add-btn {
      background: #3182ce;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button.add-btn:hover {
      background: #2b6cb0;
    }
    ul.todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      align-items: center;
      padding: 10px 8px;
      border-bottom: 1px solid #edf2f7;
      gap: 10px;
    }
    li.completed span {
      text-decoration: line-through;
      color: #a0aec0;
    }
    li span {
      flex: 1;
      font-size: 0.95rem;
      color: #2d3748;
    }
    button.del-btn {
      background: transparent;
      border: none;
      color: #e53e3e;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }
    button.del-btn:hover {
      background: #fed7d7;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/app.js"></script>
</body>
</html>
